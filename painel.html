<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propostas</title><link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#D63D27;--dk:#262626;--bg:#f1f1ef;--mut:#6a6a6a;--line:#e3e3e0}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--dk);font:14px/1.5 Montserrat,system-ui,sans-serif}
.top{background:var(--dk);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top b{font-size:17px}.top small{color:#bbb;margin-left:10px}
button,input,select,textarea{font:inherit;color:inherit}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}.b.g{background:#fff;color:var(--dk);border:1px solid var(--line)}.b.d{background:var(--dk)}
.w{padding:20px 24px;max-width:1280px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.c{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--line)}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;line-height:1.2}
h3{margin:0 0 12px;font-size:15px}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#e9e9e6;border-radius:12px;padding:10px;min-height:120px}.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col h4 i{font-style:normal;color:var(--mut);font-weight:400}.bar{height:4px;border-radius:4px;margin-bottom:10px}
.k{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;border:1px solid var(--line)}.k:hover{border-color:var(--ac)}
.k span{display:block;color:var(--mut);font-size:12px}.k i{font-style:normal;color:#b3261e;font-size:12px;font-weight:600}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:20px}@media(max-width:900px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.l{cursor:pointer}tr.l:hover{background:#faf6f5}.r{text-align:right;white-space:nowrap}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;color:#fff;font-size:12px;font-weight:600}
.pd{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.pd span{color:#b3261e}
input,select,textarea{border:1px solid #cfcfcb;border-radius:8px;padding:8px 10px;background:#fff;width:100%}textarea{min-height:64px}
#login{max-width:340px;margin:12vh auto;text-align:center}#login input{margin:14px 0}
.ov{position:fixed;inset:0;background:#0007;z-index:9;overflow:auto;padding:24px 12px}
.md{background:var(--bg);max-width:980px;margin:auto;border-radius:14px;padding:22px}.md header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:12px;color:var(--mut);font-weight:600}label input,label select,label textarea{margin-top:3px;color:var(--dk);font-weight:400}
.sec{margin-top:18px}.ln{display:grid;gap:8px;margin-bottom:8px;grid-template-columns:1fr 2fr auto}.ln.p{grid-template-columns:1fr 2fr 1fr auto}
.x{background:none;border:0;font-size:20px;color:#b3261e;cursor:pointer}
.it td{padding:6px 4px;vertical-align:top}.it input,.it select{margin-bottom:4px}
.tt{display:flex;justify-content:flex-end;gap:28px;flex-wrap:wrap;margin-top:12px}.tt b{font-size:22px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:99px;z-index:20}
.sm{padding:5px 10px;font-size:12px}.b.rd{background:#b3261e;color:#fff;border-color:#b3261e}
h4{margin:18px 0 8px;font-size:14px}.mut{color:var(--mut)}.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
#nav{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:2px;overflow-x:auto}
#nav button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
#nav button.on{color:var(--dk);border-bottom-color:var(--ac)}
input[readonly]{background:#f3f3f1}
@media(max-width:700px){
.top{padding:10px 14px;flex-wrap:wrap}.top small{display:none}.top div:last-child{display:flex;gap:6px}.top .b{padding:8px 12px;font-size:13px}
.w{padding:14px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 14px}.kpi b{font-size:20px}
#nav{padding:0 8px}#nav button{padding:11px 10px;font-size:13px}
#tab{display:block;overflow-x:auto}#tab th:nth-child(3),#tab td:nth-child(3),#tab th:nth-child(5),#tab td:nth-child(5){display:none}
#tab td:last-child{white-space:normal!important}#tab td:last-child .b{margin:2px 2px 2px 0}
.c{padding:14px}.row{grid-template-columns:minmax(0,1fr)}.row>*{min-width:0}}
input[type=checkbox]{width:auto!important;margin:3px 0 0;flex:none}label.ck{display:flex!important;gap:8px;align-items:flex-start;font-weight:400}

/* ---- v8.1: acabamento visual ---- */
body{-webkit-font-smoothing:antialiased}
button,.b{transition:background .15s,border-color .15s,box-shadow .15s}
.b:hover{filter:brightness(1.08)}.b.g:hover{background:#f6f6f4;filter:none;border-color:#cfcfcb}
.b:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d63d2766;outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.c{box-shadow:0 1px 2px #0000000a}
#nav{position:sticky;top:56px;z-index:4;align-items:center}
#nav button[data-v=catalogo]{margin-left:14px;padding-left:20px;border-left:1px solid var(--line);position:relative}
#nav button[data-v=catalogo]::before{content:"Configurações";position:absolute;top:1px;left:20px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#9a9a96;font-weight:600}
#nav button[data-v=catalogo]~button{font-weight:400}
#nav button[data-v=catalogo]~button.on{font-weight:600}
tr.l:hover{background:#fbf4f2}
#tab td .b.g[data-x],#tab td .b.g[data-a=link]{background:transparent;border-color:transparent;color:var(--mut)}
#tab td .b.g[data-x]:hover{color:#b3261e;background:#fdeceb}
.k{transition:box-shadow .15s,border-color .15s}.k:hover{box-shadow:0 2px 8px #0000001a}
.md header{position:sticky;top:-24px;background:var(--bg);z-index:3;padding:10px 0;margin:-10px 0 6px;border-bottom:1px solid var(--line)}
#md .sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
#md .sec>h3{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.act.fix{position:sticky;bottom:-24px;background:var(--bg);padding:12px 0;margin-top:20px;border-top:1px solid var(--line);z-index:3}
.dica{font-size:12px;color:var(--mut);font-weight:400;margin:4px 0 0}
#toast{box-shadow:0 4px 16px #0004;max-width:90vw;text-align:center}
.vers{color:#8a8a86;font-size:11px;margin-left:8px}
@media(max-width:700px){#nav{top:98px}#nav button[data-v=catalogo]::before{display:none}.act.fix{bottom:-24px}}

/* ---- v8.2: celular ---- */
a.b{text-decoration:none;display:inline-flex;align-items:center}
.atalhos{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
@media(max-width:700px){
body{padding-bottom:84px}
input,select,textarea{font-size:16px;min-height:44px}textarea{min-height:84px}
input[type=checkbox]{min-height:0}
.b{min-height:44px;padding:10px 16px}.b.sm{min-height:40px}
.top{flex-wrap:nowrap;position:sticky;top:0}.top>div:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top>div:last-child{flex:none}
.top>div:last-child .b:last-child{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;border-radius:99px;padding:14px 22px;box-shadow:0 6px 18px #0005}
#nav{top:56px}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.pipe{scroll-snap-type:x mandatory;grid-auto-columns:78%}.col{scroll-snap-align:start}
#tab{display:block;overflow:visible}
#tab tr:first-child{display:none}
#tab tr.l{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px;margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:12px}
#tab td{display:block;padding:0;border:0;white-space:normal}
#tab td:nth-child(1){grid-column:1;grid-row:2;color:var(--mut);font-size:12px}
#tab td:nth-child(2){grid-column:1;grid-row:1;font-weight:700;font-size:16px}
#tab td:nth-child(3){grid-column:1;grid-row:3;display:block!important;color:var(--mut);font-size:13px}
#tab td:nth-child(4){grid-column:2;grid-row:1;text-align:right}
#tab td:nth-child(5){display:none!important}
#tab td:nth-child(6){grid-column:2;grid-row:2;font-weight:700;text-align:right}
#tab td:nth-child(7){grid-column:1/-1;grid-row:4;display:flex!important;gap:6px;flex-wrap:wrap;margin-top:8px}
.ov{padding:0}
.md{border-radius:0;min-height:100vh;padding:14px;max-width:none}
.md header{top:0;margin:0 -14px 8px;padding:10px 14px}
.md header h3{font-size:15px}
.g2{grid-template-columns:1fr}.cf{grid-template-columns:1fr}
#md .sec{padding:12px}
.ln,.ln.p{display:flex;flex-wrap:wrap}.ln input{flex:1 1 100%}.ln .x{margin-left:auto}
#I,#I tbody{display:block}
#I tr:first-child{display:none}
#I tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
#I td{display:block;padding:0;width:auto!important}
#I td:first-child{grid-column:1/-1}
#I td:nth-child(2)::before,#I td:nth-child(3)::before{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:2px}
#I td:nth-child(2)::before{content:"Quantidade"}#I td:nth-child(3)::before{content:"Valor unitário (R$)"}
#I td:nth-child(4){grid-column:1;align-self:center;text-align:left;font-weight:700}
#I td:nth-child(4)::before{content:"Subtotal: ";font-weight:400;color:var(--mut)}
#I td:nth-child(5){grid-column:2;text-align:right;align-self:center}
.tt{justify-content:space-between;gap:10px}.tt b{font-size:18px}
.act.fix{display:grid;grid-template-columns:1fr 1fr;gap:8px;bottom:0;margin:20px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px #0000001a}
.act.fix .b{width:100%;justify-content:center;text-align:center}
.act.fix .b.d{order:1}.act.fix .b:not(.g):not(.d){order:2}.act.fix .b.g{order:3}.act.fix [data-x]{order:4}
.vers{display:none}
#I td{border:0}
.act.fix{grid-template-columns:repeat(6,1fr)}.act.fix .b.d,.act.fix .b:not(.g):not(.d){grid-column:span 3}.act.fix .b.g{grid-column:span 2;min-height:38px;font-size:12px;padding:8px 6px}
#busca{float:none!important;width:100%!important;display:block;margin:10px 0 4px}
}
</style></head><body>
<div id="login" class="c"><h3 id="lt">Gerador de propostas</h3><div id="f-setup" hidden><p class="mut">Primeiro acesso: crie o seu usuário.</p><input id="sk" type="password" placeholder="Chave de instalação (a que você definiu no Worker)" autocomplete="off"></div><input id="lg" placeholder="Login" autocomplete="username" autofocus><input id="pin" type="password" placeholder="Senha (mínimo 10 caracteres)" autocomplete="current-password"><input id="cod" placeholder="Código de 6 dígitos do aplicativo autenticador" inputmode="numeric" autocomplete="one-time-code" maxlength="6" hidden><button class="b" id="bentrar" onclick="entrar()">Entrar</button><p id="err" style="color:#b3261e"></p><p style="margin:8px 0 0"><a href="#" id="rec" style="color:#6a6a6a;font-size:13px">Esqueci a senha</a></p></div>
<div id="app" hidden>
<div class="top"><div><b id="tn">RECording</b><small>Gerador de propostas<span class="vers" id="vers"></span></small></div><div><button class="b g" onclick="carregar()">Atualizar</button> <button class="b g" onclick="sair()">Sair</button> <button class="b" onclick="novaDlg()">+ Nova proposta</button></div></div>
<nav id="nav"><button data-v="prop" class="on">Propostas</button><button data-v="clientes">Clientes</button><button data-v="catalogo">Catálogo</button><button data-v="condicoes">Condições</button><button data-v="mensagens">Mensagens</button><button data-v="empresa">Empresa e avisos</button><button data-v="usuarios">Usuários</button><button data-v="automacao">Automação</button><button data-v="backup">Backup</button></nav>
<div id="v-prop"><div class="w"><div class="kpis" id="kpis"></div><div class="c"><h3>Funil de propostas</h3><div class="pipe" id="pipe"></div></div>
<div class="row"><div class="c"><h3>Todas as propostas <input id="busca" placeholder="Buscar cliente ou número" style="width:240px;float:right;padding:5px 10px" oninput="lista()"></h3><div style="overflow-x:auto"><table id="tab"></table></div></div>
<div class="c"><h3>Pendências</h3><div id="pend"></div></div></div></div></div></div><div id="vx" hidden></div></div>
<div id="ov" class="ov" hidden><div class="md" id="md"></div></div><div id="toast" role="status" aria-live="polite" hidden></div>
<script>
const ST=['Atendimento','Briefing','Rascunho','Enviada','Negociação','Fechada','Perdida'];
const COR={Atendimento:'#6b6b6b',Briefing:'#3a6fd8',Rascunho:'#9a6b00',Enviada:'#D63D27','Negociação':'#7d3c98',Fechada:'#1f7a44',Perdida:'#444'};
let PIN=null,S={propostas:[],catalogo:[],url:''},cur=null;
const $=s=>document.querySelector(s),brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ERR=async r=>{let j={};try{j=await r.json()}catch(e){}if(!r.ok||j.ok===false){const er=new Error(j.erro||j.msg||('Erro '+r.status));er.status=r.status;er.dados=j;throw er}return j};
const get=u=>fetch(u,{credentials:'same-origin'}).then(ERR);
const post=(u,b)=>fetch(u,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(ERR);
const API={apiDados:()=>get('/api/dados'),apiNova:(_,id)=>post('/api/nova',{cliente_id:id||null}).then(r=>r.numero),apiSalvar:(_,o)=>post('/api/proposta',o),apiExcluir:(_,n)=>post('/api/excluir',{numero:n})};
const run=(fn,...a)=>API[fn](...a).catch(e=>{if(e.status===401)aoSair();throw e});
const pd=s=>{const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'');return m?new Date(+m[3],m[2]-1,+m[1]):null};
const hoje=()=>new Date().toLocaleDateString('pt-BR'),mais=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toLocaleDateString('pt-BR')};
const link=(p,rev)=>S.base?S.base+'/'+p.token+(rev?'?rev=1':''):S.url+'?t='+p.token+(rev?'&rev=1':'');
const foneWa=s=>{const d=String(s||'').replace(/\D/g,'');return d&&d.length<=11?'55'+d:d};
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4200)}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
function copiar(t){try{navigator.clipboard.writeText(t).catch(()=>fb(t))}catch(e){fb(t)}}
let SETUP=false,REC=false;
async function entrar(){$('#err').textContent='';$('#err').style.color='#b3261e';const l=$('#lg').value.trim(),w=$('#pin').value;try{if(SETUP)await post('/api/setup',{chave:$('#sk').value,login:l,senha:w});else if(REC)await post('/api/recuperar',{chave:$('#sk').value,login:l,senha:w});else await post('/api/login',{login:l,senha:w,codigo:$('#cod').value});SETUP=false;REC=false;await abrirApp()}catch(e){if(e.dados&&e.dados.precisa2fa){$('#cod').hidden=false;$('#cod').focus()}$('#err').textContent=e.message}}
async function abrirApp(){await carregar();$('#login').hidden=true;$('#app').hidden=false;$('#pin').value=''}
function aoSair(){$('#app').hidden=true;$('#login').hidden=false}
async function sair(){try{await post('/api/logout')}catch(e){}location.reload()}
async function boot(){try{const e=await get('/api/estado');SETUP=e.setup;if(e.versao&&$('#vers'))$('#vers').textContent=e.versao;if(SETUP){$('#f-setup').hidden=false;$('#bentrar').textContent='Criar usuário e entrar';$('#lt').textContent='Primeiro acesso'}else if(e.logado)await abrirApp()}catch(e){$('#err').textContent=e.message}}
['#sk','#lg','#pin','#cod'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter')entrar()}));
async function carregar(){S=await run('apiDados');S.config=S.config||{};$('#tn').textContent=S.config.empresa_nome||'RECording';document.title='Propostas · '+(S.config.empresa_nome||'RECording');render()}
function pend(p){const r=[],h=new Date();h.setHours(0,0,0,0);if(!['Briefing','Rascunho','Enviada','Negociação'].includes(p.status))return r;
 if(p.briefing!=='Sim')r.push('Sem briefing registrado');if(!p.itens.length)r.push('Sem itens de preço');if(!p.objetivo)r.push('Sem objetivo');
 if(['Enviada','Negociação'].includes(p.status)){const f=pd(p.followup);if(!f)r.push('Sem data de follow-up');else if(f<h)r.push('Follow-up vencido ('+p.followup+')');if(!p.contato_whatsapp&&!p.contato_email)r.push('Sem WhatsApp ou e-mail do cliente para o follow-up automático')}
 if(p.pendencias)r.push(p.pendencias);return r}
function render(){const P=S.propostas,now=new Date(),em=s=>P.filter(p=>s.includes(p.status)),sum=a=>a.reduce((x,p)=>x+p.t.total,0);
 const fech=em(['Fechada']),fm=fech.filter(p=>{const d=pd(p.resposta_data||p.data_envio||p.data);return d&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
 const per=em(['Perdida']).length,conv=fech.length+per?Math.round(fech.length*100/(fech.length+per)):0,pe=P.flatMap(p=>pend(p).map(t=>({p,t})));
 const K=[['Em aberto',em(['Rascunho','Enviada','Negociação']).length],['Valor em negociação',brl(sum(em(['Enviada','Negociação'])))],['Fechado no mês',brl(sum(fm))],['Conversão',conv+'%'],['Pendências',pe.length]];
 $('#kpis').innerHTML=K.map(k=>`<div class="c kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('');
 $('#pipe').innerHTML=ST.map(s=>{const a=em([s]);return `<div class="col"><div class="bar" style="background:${COR[s]}"></div><h4>${s}<i>${a.length} · ${brl(sum(a))}</i></h4>${a.map(p=>`<div class="k" data-n="${esc(p.numero)}"><b>${esc(p.cliente||'(sem cliente)')}</b><span>${esc(p.numero)} · ${brl(p.t.total)}</span>${pend(p).length?`<i>${pend(p).length} pendência(s)</i>`:''}</div>`).join('')}</div>`}).join('');
 $('#pend').innerHTML=pe.length?pe.map(x=>`<div class="pd" data-n="${esc(x.p.numero)}"><b>${esc(x.p.cliente||x.p.numero)}</b><br><span>${esc(x.t)}</span></div>`).join(''):'<p style="color:#6a6a6a">Tudo em dia.</p>';
 lista()}
function qiso(i){return i?new Date(i).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function lista(){const q=($('#busca').value||'').toLowerCase();

 <div class="g2">${SEL('Status','status',ST)}${SEL('Faixa de preço','faixa',['1','2'])}${SEL('Briefing recebido','briefing',['Sim','Não'])}${F('Follow-up (dd/mm/aaaa)','followup')}

 return `<tr><td>${no?`<input ${d} data-f="servico" value="${esc(i.servico)}">`:`<select ${d} data-f="servico"><option value="">Escolher…</option>${grupos(i.servico)}<option value="__p">Personalizado…</option></select>`}<input ${d} data-f="descricao" value="${esc(i.descricao)}" placeholder="Descrição"><input ${d} data-f="observacao" value="${esc(i.observacao)}" placeholder="Observação"></td><td style="width:80px"><input type="number" ${d} data-f="qtd" value="${i.qtd}" step="any"></td><td style="width:120px"><input type="number" ${d} data-f="valor_unit" value="${i.valor_unit}" step="any"></td><td class="r" id="s${k}">${brl(i.qtd*i.valor_unit)}</td><td><button class="x" data-del="itens" data-i="${k}">×</button></td></tr>`}).join('');tot()}
function tot(){const sub=cur.itens.reduce((a,i)=>a+i.qtd*i.valor_unit,0),d=sub*(+cur.desconto_pct||0)/100,im=(sub-d)*(+cur.imposto_pct||0)/100;
 $('#T').innerHTML=`<span>Subtotal<br><b>${brl(sub)}</b></span><span>Desconto<br><b>− ${brl(d)}</b></span><span>Impostos<br><b>${brl(im)}</b></span><span>Total<br><b style="color:#F2543D">${brl(sub-d+im)}</b></span>`;cur.itens.forEach((i,k)=>{const e=$('#s'+k);if(e)e.textContent=brl(i.qtd*i.valor_unit)})}

 if(t.dataset.l==='itens'&&t.tagName==='INPUT'){const i=cur.itens[t.dataset.i],f=t.dataset.f;i[f]=['qtd','valor_unit'].includes(f)?(parseFloat(t.value)||0):t.value;tot()}
 else if(t.dataset.l)cur[t.dataset.l][t.dataset.i][t.dataset.f]=t.value});

 o.itens=cur.itens.filter(i=>i.servico).map(i=>({servico:i.servico,descricao:i.descricao,observacao:i.observacao,qtd:i.qtd,valor_unit:i.valor_unit}));
 o.imposto_pct=+cur.imposto_pct||0;o.desconto_pct=+cur.desconto_pct||0;o.faixa=+cur.faixa||1;['E','P','t'].forEach(k=>delete o[k]);return o}

 <div style="overflow-x:auto;margin-top:12px"><table><tr><th>Quando</th><th>Mensagem</th><th>Destino</th><th>Situação</th></tr>${st.avisos.length?st.avisos.map(a=>`<tr><td>${esc(quando(a.criado))}</td><td>${esc(a.assunto)}</td><td>${esc([a.whatsapp,a.email].filter(Boolean).join(' · '))}</td><td>${estado(a)}</td></tr>`).join(''):'<tr><td colspan="4" class="mut">Nenhuma mensagem ainda.</td></tr>'}</table></div>${btnRow('<button class="b g" id="diagatu">Atualizar diagnóstico</button>')}`}

ADM.backup=async()=>{$('#vx').innerHTML=wrap('Backup e importação',`<h4>Backup</h4><p class="mut">Baixa uma cópia de tudo: propostas, itens, catálogo, condições e configurações. Faça de vez em quando e antes de mudanças grandes.</p>${btnRow('<a class="b" href="/api/backup" style="text-decoration:none;display:inline-block">Baixar backup</a>')}<h4 style="margin-top:24px">Importar ou restaurar arquivos</h4><p class="mut">Escolha os arquivos (pode ser vários de uma vez) e o sistema reconhece cada um:<br>• <b>backup do sistema</b> (.json baixado aqui);<br>• <b>briefings do Tally</b>: o .csv exportado em Submissions → Export, ou um .json;<br>• <b>abas da planilha antiga</b>: .csv de Propostas, Itens, Catalogo, Condicoes e Config.</p><input type="file" id="imp" accept=".csv,.json,.js,.txt,text/csv,application/json" multiple><div id="impr" class="mut" style="margin-top:10px"></div>`)};
function csv(t){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===','){r.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=h}if(c!==''||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y!==''))}
const detecta=h=>{const s=new Set(h);if(h.some(x=>/^(empresa|nome da empresa|company name|company domain name|nome do dom[ií]nio da empresa|nome fantasia|raz[aã]o social)/.test(x))&&!s.has('numero'))return 'clientes';if((s.has('first name')||s.has('nome'))&&(s.has('last name')||s.has('sobrenome'))&&!s.has('numero'))return 'clientes';if(s.has('faixa1'))return 'catalogo';if(s.has('titulo')&&s.has('texto'))return 'condicoes';if(s.has('chave')&&s.has('valor'))return 'config';if(s.has('login'))return 'usuarios';if(s.has('numero')&&s.has('servico'))return 'itens';if(s.has('numero')&&s.has('status'))return 'propostas';return ''};

 else if(b.id==='clisalv'){const o={empresa:cur.cliente,contato_nome:cur.contato_nome,contato_email:cur.contato_email,contato_whatsapp:cur.contato_whatsapp};const r=await post('/api/clientes',o);cur.cliente_id=r.id;await salvar();await carregar();abrir(cur.numero);toast('Cliente cadastrado e vinculado')}
 else if(b.id==='tini'){TFA=await post('/api/2fa/iniciar');ADM.usuarios()}
 else if(b.id==='tconf'){await post('/api/2fa/ativar',{codigo:$('#tcod').value});TFA=null;ADM.usuarios();toast('Verificação em duas etapas ligada')}
 else if(b.id==='toff'){const w=prompt('Digite sua senha para desligar a verificação em duas etapas:');if(w){await post('/api/2fa/desativar',{senha:w});ADM.usuarios();toast('Desligada')}}
 else if(b.id==='sess'){await post('/api/sessoes/encerrar');toast('Outras sessões encerradas')}
 else if(D.upw!==undefined){$('#ul').value=D.upw;$('#us').focus()}
 else if(D.urm!==undefined){if(confirm('Remover o usuário '+D.urm+'?')){await post('/api/usuario/remover',{login:D.urm});ADM.usuarios();toast('Usuário removido')}}
 else if(b.id==='usave'){const l=$('#ul').value.trim().toLowerCase();await post('/api/usuario',{login:l,senha:$('#us').value});if(l===S.usuario){toast('Senha alterada. Entre de novo.');aoSair()}else{ADM.usuarios();toast('Usuário salvo')}}
 else if(b.id==='newkey'){if(!document.querySelector('[data-cp]')||confirm('A chave antiga deixa de funcionar. Depois você precisa atualizar o Tally e o n8n. Continuar?')){await post('/api/chave');ADM.automacao();toast('Nova chave gerada')}}
 else if(b.id==='impgo'){const res=[],bk=IMP.find(y=>y.tabela==='backup');
  if(bk){if(!confirm('O backup SUBSTITUI propostas, catálogo, condições e configurações atuais. Continuar?'))return;await post('/api/restaurar',bk.obj);res.push('backup restaurado')}
  for(const tb of ['config','catalogo','condicoes','clientes','propostas','itens','briefings','briefings_csv'])for(const x of IMP.filter(y=>y.tabela===tb)){const r=await post('/api/importar',{tabela:tb,linhas:x.linhas});res.push(tb.indexOf('briefings')===0?'briefings: '+r.qtd:tb==='clientes'?'clientes: '+r.criados+' novos, '+r.atualizados+' atualizados, '+r.ignorados+' ignorados':tb+': '+r.qtd+' linhas');(r.avisos||[]).forEach(a=>res.push('&nbsp;&nbsp;⚠ '+esc(a)));(r.numeros||[]).forEach(n=>res.push('&nbsp;&nbsp;→ '+esc(n)))}
  await carregar();$('#impr').innerHTML='<b>Importado:</b><br>'+res.join('<br>');IMP=[]}
 }catch(er){if(er.status!==401)toast('Erro: '+er.message)}});
document.addEventListener('input',e=>{const t=e.target,D=t.dataset;if(t.id==='cbusca'){$('#clit').innerHTML=rowsCli();return}if(D.cf&&D.cf.indexOf('msg_')===0)pvMsg(D.cf);if(D.ci!==undefined&&D.f)CAT[D.ci][D.f]=['faixa1','faixa2'].includes(D.f)?(parseFloat(t.value)||0):t.value;else if(D.di!==undefined&&D.f)CND[D.di][D.f]=t.value});
const isTally=o=>{const a=[].concat(o);return a.length>0&&a.every(x=>x&&typeof x==='object'&&((x.data&&Array.isArray(x.data.fields))||Object.keys(x).some(k=>/^question_/.test(k))))};
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='imp'||!t.files.length)return;
 try{IMP=[];const m=[];
  for(const f of t.files){const txt=await f.text(),tr=txt.replace(/^\uFEFF/,'').trim();
   if(/^[\[{]/.test(tr)){let o;try{o=JSON.parse(tr)}catch(er){m.push(f.name+': JSON inválido (ignorado)');continue}
    if(o&&o.versao===1&&Array.isArray(o.propostas)){IMP.push({tabela:'backup',obj:o});m.push(`${f.name}: backup do sistema (${o.propostas.length} propostas) → vai SUBSTITUIR os dados atuais`)}
    else if(isTally(o)){const L=[].concat(o);IMP.push({tabela:'briefings',linhas:L});m.push(`${f.name}: ${L.length} briefing(s) do Tally → viram propostas`)}
    else m.push(f.name+': não reconheci este JSON (ignorado)');continue}
   const R=csv(txt);if(!R.length){m.push(f.name+': arquivo vazio');continue}
   const h0=R[0].map(x=>x.trim()),h=h0.map(x=>x.toLowerCase());
   if(h.includes('submission id')||h.includes('respondent id')){const L=R.slice(1).map(l=>Object.fromEntries(h0.map((k,i)=>[k,l[i]==null?'':l[i]])));IMP.push({tabela:'briefings_csv',linhas:L});m.push(`${f.name}: ${L.length} briefing(s) do Tally (CSV) → viram propostas`);continue}
   const tb=detecta(h);if(!tb){m.push(f.name+': não reconheci este arquivo (ignorado)');continue}
   if(tb==='usuarios'){m.push(f.name+': usuários não são importados; crie em Usuários');continue}
   const L=R.slice(1).map(l=>Object.fromEntries(h.map((k,i)=>[k,l[i]==null?'':l[i]])));IMP.push({tabela:tb,linhas:L});m.push(`${f.name}: ${L.length} linhas → ${tb}`)}
  $('#impr').innerHTML=m.map(esc).join('<br>')+(IMP.length?btnRow('<button class="b" id="impgo">Importar agora</button>'):'')
 }catch(er){toast('Erro: '+er.message)}});
// o scroll do mouse não pode mexer em campos numéricos (era assim que o imposto virava -17)
document.addEventListener('wheel',()=>{const a=document.activeElement;if(a&&a.type==='number')a.blur()},{passive:true});
document.addEventListener('click',e=>{if(e.target.id==='rec'){e.preventDefault();REC=true;$('#f-setup').hidden=false;$('#lt').textContent='Recuperar acesso';$('#bentrar').textContent='Definir nova senha e entrar';$('#err').style.color='#6a6a6a';$('#err').textContent='Use a chave de instalação do Worker, o seu login e a nova senha (mínimo 10 caracteres).'}});
$('#md').addEventListener('change',e=>{const t=e.target,setK=(k,v)=>{cur[k]=v;const x=$('#md [data-k="'+k+'"]');if(x)x.value=v};
 if(t.id==='cli'){const c=(S.clientes||[]).find(x=>String(x.id)===t.value);cur.cliente_id=c?c.id:null;if(c){setK('cliente',c.empresa);setK('contato_nome',c.contato_nome);setK('contato_whatsapp',c.contato_whatsapp);setK('contato_email',c.contato_email)}}
 if(t.id==='pagpre'&&t.value!==''){const P=[[30,'na aprovação da proposta','30 dias após a aprovação'],[50,'na aprovação da proposta','30 dias após a aprovação'],[50,'na aprovação da proposta','na entrega do material final'],[100,'na aprovação da proposta','']][+t.value];setK('pag_entrada',P[0]);setK('pag_entrada_txt',P[1]);setK('pag_resto_txt',P[2]);t.value=''}});
boot();
</script></body></html>
